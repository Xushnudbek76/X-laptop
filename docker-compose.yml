services:
  backend:
    build:
      context: .
    image: x-laptop-backend:latest
    container_name: x-laptop-backend
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${BACKEND_PORT:-3003}:3003"
    volumes:
      - x-laptop-uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - x-laptop

volumes:
  x-laptop-uploads:

networks:
  x-laptop:
    name: x-laptop-network
